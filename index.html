<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DuckDB Web Shell</title>
  <meta name="description" content="DuckDB SQL Shell running entirely in your browser via WebAssembly.">
  <meta property="og:title" content="DuckDB Web Shell">
  <meta property="og:description" content="DuckDB SQL Shell running entirely in your browser via WebAssembly.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DuckDB">
  <meta property="og:image" content="https://duckdb.org/images/sharingduckdb.jpg">
  <meta name="twitter:card" content="summary">
  <meta property="twitter:title" content="DuckDB Web Shell">
  <meta property="twitter:image" content="https://duckdb.org/images/sharingduckdb.jpg">
  <meta name="twitter:site" content="@DuckDB">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
  <link rel="shortcut icon" href="/static/favicons/favicon.ico">
  <!-- A script in static/shell/ needs a new name after every edit, because /static/ is cached longer than this page.
       From this checkout's root, run: python3 scripts/shell_page.py rename . -->
  <!-- Root-relative on purpose: this page is also served at /oauth/callback, where "./static/..." does not exist. -->
  <script src="/static/shell/oauth-callback.8688fc449a.js"></script>
  <script src="./static/shell/shell-boot.495715e336.js"
          data-shell-js="./static/assets/duckdb.6cef8babbe.js"
          data-shell-wasm="./static/assets/duckdb.b5a13b8bff.wasm"
          data-worker="./static/assets/worker.c9d26c9032.js"
          data-engine="./static/assets/duckdb-eh.5bdb46b6d8.wasm"></script>
  <style>
    .embed #nav-new, .embed #nav-import, .embed .landingmenu nav > div:has(.hasSub), .embed .hamburger { display: none; }
  </style>
  <link rel="stylesheet" href="./static/vendor/xterm-5.5.0/xterm.css">
  <link rel="stylesheet" href="https://duckdb.org/css/main.css" crossorigin="anonymous">
  <script data-cfasync="false" src="./static/shell/shell-theme.50befeb668.js"></script>
  <style>
    .demo-btn {
      border-radius: var(--border-radius-box);
      border: 1px solid var(--menu-dropdown-border-color, #333);
      background-color: var(--menu-topmenu-background-color, rgba(250, 250, 250, 0.6));
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .3s;
      color: var(--main-text-secondary-color, #666);
      cursor: pointer; padding: 0;
      pointer-events: all;
    }
    .demo-btn:hover:not(:disabled) { border-color: var(--menu-topmenu-text-color-hover, #6A58DA); color: var(--menu-topmenu-text-color-hover, #6A58DA); }
    .demo-btn { position: relative; }
    .demo-btn[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      margin-top: 8px; padding: 6px 10px;
      background: var(--grey-10, #1a1a1a); color: var(--grey-95, #f2f2f2);
      font: 12px monospace; white-space: pre; border-radius: 4px;
      z-index: 100; pointer-events: none; max-width: 400px;
    }
  </style>
</head>
<body class="layout_webshell">
  <!-- SVG symbol defs for icons (from duckdb.org) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="sun" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M12 2V4M12 20V22M4 12H2M6.31412 6.31412L4.8999 4.8999M17.6859 6.31412L19.1001 4.8999M6.31412 17.69L4.8999 19.1042M17.6859 17.69L19.1001 19.1042M22 12H20M17 12C17 14.7614 14.7614 17 12 17C9.23858 17 7 14.7614 7 12C7 9.23858 9.23858 7 12 7C14.7614 7 17 9.23858 17 12Z"/></symbol>
    <symbol id="moon-01" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M22 15.8442C20.6866 16.4382 19.2286 16.7688 17.6935 16.7688C11.9153 16.7688 7.23116 12.0847 7.23116 6.30654C7.23116 4.77135 7.5618 3.3134 8.15577 2C4.52576 3.64163 2 7.2947 2 11.5377C2 17.3159 6.68414 22 12.4623 22C16.7053 22 20.3584 19.4742 22 15.8442Z"/></symbol>
    <symbol id="chevron-down" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M6 9L12 15L18 9"/></symbol>
    <symbol id="play-circle" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></symbol>
  </svg>

  <header>
    <div class="headerline">
      <div class="headercontent">
        <div class="duckdbhome">
          <a href="https://duckdb.org/"><img src="https://duckdb.org/images/logo-dl/DuckDB_Logo-horizontal.svg" alt="DuckDB Web Shell" class="downloadlogo"></a>
          <div class="webshell-logo" aria-hidden="true"></div>
        </div>
        <div class="landingmenu">
          <nav>
            <div><a href="#" id="nav-new">New</a></div>
            <div><a href="#" id="nav-share">Share</a></div>
            <div><a href="#" id="nav-import">Import</a></div>
            <div>
              <div class="hasSub">
                <div><a href="#">Datasets</a><svg class="icon chevron-down"><use href="#chevron-down"></use></svg></div>
              </div>
              <div class="submenuwrap">
                <ul>
                  <li><a href="#" class="example-link" data-queries="ATTACH-'https%3A%2F%2Fblobs.duckdb.org%2Fdatalake%2Fnl%20railway.ducklake'-AS-nl_railway-(TYPE-ducklake)~,USE-nl_railway~,.tables,FROM-services-LIMIT-5~">NL Railway (DuckLake)</a></li>
                  <li><a href="#" class="example-link" data-queries="LOAD-httpfs~,FROM-'https%3A%2F%2Fblobs.duckdb.org%2Fdata%2FStar_Trek%20Season_1.csv'~">Star Trek (CSV)</a></li>
                  <li><a href="#" class="example-link" data-queries="LOAD-httpfs~,FROM-'https%3A%2F%2Fblobs.duckdb.org%2Ftrain_services.parquet'~">Train Services (Parquet)</a></li>
                  <li><a href="#" class="example-link" data-queries="ATTACH-IF-NOT-EXISTS-'https%3A%2F%2Fblobs.duckdb.org%2Fdatalake%2Ftpch%20sf3.ducklake'-AS-tpch-(TYPE-ducklake)~,.tables">TPCH on DuckLake</a></li>
                  <li><a href="#" class="example-link" data-queries="LOAD-httpfs~,SELECT-COUNT(*)-FROM-'https%3A%2F%2Fblobs.duckdb.org%2Fdata%2Fyellow_tripdata_2010%2001.parquet'~,SELECT-COUNT(*)-AS-trips%2C-AVG(tip_amount)-AS-avg_tip%2C-AVG(trip_distance)-AS-avg_distance-FROM-'https%3A%2F%2Fblobs.duckdb.org%2Fdata%2Fyellow_tripdata_2010%2001.parquet'~">NYC Taxi (Parquet)</a></li>
                  <li><a href="#" class="example-link" data-queries="LOAD-spatial~,LOAD-httpfs~,ATTACH-'https%3A%2F%2Fblobs.duckdb.org%2Fdata%2Fbiketrips.duckdb'-AS-biketrips-(READ_ONLY)~,DESCRIBE-biketrips.rides~,FROM-biketrips.hoods-ORDER-BY-ST_Area(geom)-DESC-LIMIT-5~">NYC Bike Trips (Spatial)</a></li>
                  <li><a href="#" class="example-link" data-queries="LOAD-httpfs~,CREATE-OR-REPLACE-SECRET-__my_secret__-(TYPE-s3%2C-KEY_ID-'AKIATZA7ONMDJXWR4UVN'%2C-SECRET-'elm876%2FSqATe455MgkK6RB4fGORgNYep7%2F0GXajv'%2C-REGION-'us%20west%201')~,ATTACH-IF-NOT-EXISTS-'arn%3Aaws%3As3tables%3Aus%20east%201%3A259911478022%3Abucket%2Ficeberg%20on%20the%20browser'-AS-iceberg_dataset-(TYPE-iceberg%2C-ENDPOINT_TYPE-'s3_tables')~,.tables,FROM-iceberg_dataset.tpch10.region~">Iceberg (S3 Tables)</a></li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
        <div class="options">
          <button id="nav-demo" class="demo-btn" style="visibility:hidden" disabled>
            <svg class="icon" style="width:16px;height:16px"><use href="#play-circle"></use></svg>
          </button>
          <button class="mode" data-mode="dark">
            <svg class="icon icon-sun"><use href="#sun"></use></svg>
            <svg class="icon icon-moon"><use href="#moon-01"></use></svg>
          </button>
          <button class="hamburger hamburger--squeeze" type="button" aria-label="Menu">
            <span class="hamburger-box"><span class="hamburger-inner"></span></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="terminal"></div>

  <script src="./static/vendor/xterm-5.5.0/xterm.js"></script>
  <script src="./static/vendor/addon-fit-0.10.0/addon-fit.js"></script>
  <script src="./static/shell/shell-main.304a0223e5.js"></script>
</body>
</html>
